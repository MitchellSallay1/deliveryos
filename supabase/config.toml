project_id = "deliveryos-liberia"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]

# The hosted project's Send SMS Auth Hook is configured and production-
# tested via the Supabase Dashboard (Authentication -> Auth Hooks), not
# this file. An [auth.hook.send_sms] block was previously added here for
# local `supabase start` parity, but the Supabase CLI validates it eagerly
# on every subcommand (including `db push`, which has nothing to do with
# Auth Hooks) and requires a real, correctly-formatted secret value to be
# present in the shell environment just to load this config file at all.
# That made routine migration pushes fail for a purely local-dev concern,
# so it's removed. This has no effect on the deployed Edge Function,
# SEND_SMS_HOOK_SECRET, or the Dashboard's Auth Hook configuration — none
# of those live in this file.

[storage]
enabled = true
