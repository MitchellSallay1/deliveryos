<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS Safari does not read the web app manifest for Add to Home
         Screen — it needs its own tag. 180x180 is Apple's recommended
         apple-touch-icon size; rasterized from maskable-icon.svg (full-
         bleed background, no pre-rounded corners) since iOS applies its
         own corner rounding to whatever square image is provided. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeliveryOS" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#FFCB05" />
    <!-- vite-plugin-pwa injects the correct <link rel="manifest"> itself
         (with devOptions.enabled, this also works in `vite dev`) — a
         second hardcoded tag here was redundant and, in dev mode, still
         pointed at a path the dev server didn't serve. -->
    <meta name="description" content="DeliveryOS — the operating system for modern delivery businesses. Dispatch, riders, tracking, COD, and operations in one platform." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DeliveryOS — Deliver smarter" />
    <meta property="og:description" content="Manage dispatch, riders, live tracking, customers, and logistics from one platform. Powered by MTN." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DeliveryOS — Deliver smarter" />
    <meta name="twitter:description" content="Manage dispatch, riders, live tracking, customers, and logistics from one platform." />
    <title>DeliveryOS — Deliver smarter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
